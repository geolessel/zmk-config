CONFIG_ZMK_KEYBOARD_NAME="Geo's Corne"

# No LEDs or OLED are installed, so RGB underglow, the display, and
# external power control stay at their defaults.

# Deep sleep after 30 minutes idle (default is off; default timeout 900000)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Enables &soft_off (full power off from the FNS layer)
CONFIG_ZMK_PM_SOFT_OFF=y

# Left (central) half reads the right half's battery level and reports it to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
